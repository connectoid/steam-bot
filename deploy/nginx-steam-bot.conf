# HTTPS для вебхуков Payli на порту 8443 (порт 443 занят VPN-сервером SoftEther).
# Payli принимает webhook_url только на 443 или 8443.
#
# Установка:
#   sudo cp deploy/nginx-steam-bot.conf /etc/nginx/sites-available/steam-bot.conf
#   sudo ln -s /etc/nginx/sites-available/steam-bot.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Проверка: curl https://beley-n8n.duckdns.org:8443/payli/webhook  ->  {"ok": true}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name beley-n8n.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/beley-n8n.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beley-n8n.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /payli/webhook {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
