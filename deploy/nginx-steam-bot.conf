# Вебхуки Payli на порту 8443 (порт 443 занят VPN-сервером).
# Этот location вставляется в существующий server { listen 8443 ssl; ... }
# в /etc/nginx/sites-available/n8n (там же сертификат Let's Encrypt для beley-n8n.duckdns.org),
# перед блоком "location / { ... proxy_pass http://127.0.0.1:5678; }".
# Затем: sudo nginx -t && sudo systemctl reload nginx
# Проверка: curl https://beley-n8n.duckdns.org:8443/payli/webhook  ->  {"ok": true}

location = /payli/webhook {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 10s;
}

# Вебхуки Payli для заказов из MAX-бота (max_bot.py) — в тот же server-блок 8443:
location = /payli/webhook-max {
    proxy_pass http://127.0.0.1:8092;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 10s;
}
