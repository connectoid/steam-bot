# Вставьте этот location внутрь server { ... } с listen 443 ssl
# для beley-n8n.duckdns.org (рядом с location / для n8n), затем:
#   sudo nginx -t && sudo systemctl reload nginx
# Проверка снаружи: curl https://beley-n8n.duckdns.org/payli/webhook  ->  {"ok": true}

location = /payli/webhook {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 10s;
}
